name: Pubblica news, mercatino e avvisi

# Parte quando cambia una news, un annuncio del mercatino, l'avviso in cima al sito o quello di una capanna (di solito salvati dall'area di redazione admin/):
# prepara foto e nomi, rigenera tutte le pagine e pubblica il risultato.
on:
  push:
    branches: [main]
    paths:
      - "data/news/**"
      - "assets/img/news/**"
      - "docs/news/**"
      - "data/mercatino/**"
      - "assets/img/mercatino/**"
      - "data/avviso.json"
      - "data/avvisi-capanne/**"
  workflow_dispatch:        # avvio manuale da GitHub › Actions › "Run workflow"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main         # l'ultima versione, anche se nel frattempo è arrivata un'altra news

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepara le news (nome della pagina, foto in WebP, PDF nella cartella dell’anno)
        run: |
          pip install --quiet pillow==12.3.0
          python scripts/prepara_news.py

      - name: Prepara il mercatino (foto in WebP con il nome dell’annuncio)
        run: python scripts/prepara_mercatino.py

      - name: Rigenera le pagine
        run: python scripts/redesign/pages.py > /dev/null

      - name: Prepara le notifiche (news e avviso con «Invia anche come notifica»)
        # i messaggi vanno in un file fuori dal repository; nei JSON la casella si spegne (si pubblica qui sotto)
        run: python scripts/notifiche.py prepara "$RUNNER_TEMP/notifiche.json"

      - name: Pubblica se ci sono novità
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Niente da pubblicare."
            exit 0
          fi
          git config user.name  "casticino-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Redazione: pagine aggiornate"
          # se nel frattempo è arrivata un'altra modifica, ci si mette in coda
          git pull --rebase
          git push

      - name: Invia le notifiche
        env:
          NOTIFICHE_TOKEN: ${{ secrets.NOTIFICHE_TOKEN }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: |
          if [ "$(cat "$RUNNER_TEMP/notifiche.json")" = "[]" ]; then echo "Nessuna notifica."; exit 0; fi
          # si aspetta che GitHub Pages pubblichi la pagina, così chi tocca la notifica la trova già online
          sleep 90
          pip install --quiet pywebpush==2.5.0
          python scripts/notifiche.py invia "$RUNNER_TEMP/notifiche.json"
