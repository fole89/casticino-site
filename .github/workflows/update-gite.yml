name: Aggiorna programma gite da Droptour

# gite.html legge le gite in tempo reale da Droptour (assets/gite.js); qui si aggiorna solo la copia di riserva
# (data/gite.json), l'elenco già pronto nella pagina (per chi non ha JavaScript), le prossime gite in home
# e l'indice della ricerca. Ogni mattina si rigenera anche il mercatino, così gli annunci scaduti escono dalla pagina.
on:
  schedule:
    - cron: "47 4 * * *"   # ogni giorno alle 04:47 UTC (06:47 ora estiva svizzera)
  workflow_dispatch:        # avvio manuale da GitHub › Actions › "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-gite
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leggi il programma da Droptour e genera data/gite.json
        run: python scripts/update_gite.py

      - name: Rigenera la pagina e la ricerca
        # sempre: anche senza gite nuove, le gite passate escono dall'elenco, gli stati delle iscrizioni cambiano con la data
        # e gli annunci scaduti del mercatino spariscono; anche gita.html (e de/, en/), che punta alla copia con l'impronta aggiornata
        run: python scripts/redesign/pages.py gite.html de/gite.html en/gite.html gita.html de/gita.html en/gita.html index.html mercatino.html cerca.html

      - name: Pubblica se ci sono novità
        run: |
          if git diff --quiet -- data/gite.json data/cerca.json gite.html de/gite.html en/gite.html gita.html de/gita.html en/gita.html index.html mercatino.html cerca.html; then
            echo "Nessuna novità."
            exit 0
          fi
          git config user.name  "casticino-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gite.json data/cerca.json gite.html de/gite.html en/gite.html gita.html de/gita.html en/gita.html index.html mercatino.html cerca.html
          git commit -m "Gite: aggiornamento automatico da Droptour"
          git pull --rebase
          git push
