# Area di redazione delle news e del mercatino (Decap CMS). Si apre su …/admin/ e salva direttamente nel repository:
# ogni news è un file data/news/<data>-<titolo>.json, ogni annuncio del mercatino data/mercatino/<data>-<titolo>.json;
# il workflow .github/workflows/news.yml prepara le foto, rigenera le pagine e le pubblica.
# Vedi scripts/cms-auth/LEGGIMI.md per il login.

backend:
  name: github
  repo: fole89/casticino-site
  branch: main
  auth_scope: public_repo          # il repository è pubblico: basta il permesso minimo
  base_url: https://casticino-cms-auth.fole89.workers.dev   # indirizzo del servizio di login (scripts/cms-auth/)
  auth_endpoint: auth
  commit_messages:             # {{collection}} = nome della raccolta (news o annuncio, label_singular qui sotto)
    create: "Redazione: nuovo {{collection}} «{{slug}}»"
    update: "Redazione: modifica {{collection}} «{{slug}}»"
    delete: "Redazione: eliminato {{collection}} «{{slug}}»"
    uploadMedia: "Redazione: caricato {{path}}"
    deleteMedia: "Redazione: tolto {{path}}"

locale: it
site_url: https://fole89.github.io/casticino-site/
display_url: https://fole89.github.io/casticino-site/
logo_url: assets/logo-cas-stemma.webp

# foto caricate: arrivano in assets/img/news/, prepara_news.py le converte in WebP e le sposta in assets/img/news/<anno>/
# (stessa cartella delle foto già pubblicate, così l'editor mostra anche quelle)
media_folder: assets/img/news
public_folder: assets/img/news

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: news
    label: News
    label_singular: news
    description: "Le news della sezione, dalla più recente. Dopo «Pubblica» la news è online in uno o due minuti."
    folder: data/news
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('DD.MM.YYYY')}} · {{title}}"
    sortable_fields:
      - field: date
        default_sort: desc
      - title
    view_groups:
      - label: Anno
        field: date
        pattern: '\d{4}'
      - label: Categoria
        field: category
    fields:
      - label: Titolo
        name: title
        widget: string
        hint: "Breve e in minuscolo normale (niente parole TUTTE MAIUSCOLE): si legge meglio nelle schede."
      - label: Invia anche come notifica
        name: notifica
        widget: boolean
        default: false
        required: false
        hint: "Acceso: alla pubblicazione chi ha attivato le notifiche riceve titolo e riassunto sul telefono. Solo per le cose importanti, al massimo una o due a settimana. Dopo l’invio si spegne da solo; riaccenderlo rimanda la notifica."
      - label: Categoria
        name: category
        widget: select
        required: false
        options: ["Capanne", "Gite", "Corsi", "Giovani", "Senior", "Sezione", "Eventi", "Incontri", "Itinerario", "Sicurezza"]
        hint: "Compare accanto alla data e serve per il filtro della pagina News. Incontri: serate, conferenze e film. Eventi: feste, mercatini, gare. Sicurezza: avvisi e richiami di materiale."
      - label: Data
        name: date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"
        default: "{{now}}"
        hint: "L’ora serve solo a ordinare le news dello stesso giorno."
      - label: Foto principale
        name: image
        widget: image
        required: false
        choose_url: false
        hint: "JPG o PNG, anche grande: viene ridimensionata e convertita da sola. Si vede accanto al testo e nelle schede."
      - label: Descrizione della foto
        name: alt
        widget: string
        required: false
        hint: "Cosa si vede, per chi non può vedere la foto (es. «Scialpinisti in salita verso il Pizzo Rotondo»)."
      - label: Riassunto
        name: excerpt
        widget: text
        required: false
        hint: "Due righe per la scheda in home, nell’elenco delle news e nella notifica. Se resta vuoto si usa l’inizio del testo."
      - label: Testo
        name: testo
        widget: markdown
        required: false
        modes: ["rich_text"]
        buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"]
        editor_components: ["image"]
      - label: Allegati PDF
        name: allegati
        widget: list
        required: false
        label_singular: allegato
        summary: "{{fields.titolo}}"
        hint: "Solo PDF (programmi, inviti, moduli): compaiono come link sotto il testo. Le foto vanno in «Foto principale» o nel testo; non caricare lo stesso file in due campi."
        fields:
          - label: Titolo del link
            name: titolo
            widget: string
          - label: File
            name: file
            widget: file
            choose_url: false
            media_folder: /docs/news
            public_folder: docs/news
            # Decap carica qualsiasi file: la convalida blocca «Pubblica» finché non è un PDF
            pattern: ['\.[pP][dD][fF]$', "un file PDF (nome che finisce con .pdf)"]
      # campi che la redazione non tocca: restano nel file e il sito li usa
      - label: Testo HTML (news del vecchio sito)
        name: html
        widget: hidden
        required: false
      - label: Notifica inviata il
        name: notifica_inviata
        widget: hidden
        required: false
      - label: Pagina
        name: file
        widget: hidden
        required: false

  - name: avvisi
    label: Avvisi
    label_singular: avviso
    description: "In rosso gli avvisi ora visibili sul sito. In cima la striscia su tutte le pagine; sotto, un riquadro per capanna sulla sua pagina, subito sotto la foto (grigio scuro per le informazioni, es. date di apertura; rosso per le cose importanti, es. strada chiusa). Scrivi il testo e premi «Pubblica»: è online in uno o due minuti. Per toglierlo: «Elimina» e poi «Pubblica»."
    files:
      - label: Avviso in cima al sito (tutte le pagine)
        name: avviso
        file: data/avviso.json
        fields:
          - label: Elimina l’avviso
            name: elimina
            widget: elimina
            required: false
          - label: Invia anche come notifica
            name: notifica
            widget: boolean
            default: false
            required: false
            hint: "Acceso: alla pubblicazione chi ha attivato le notifiche riceve il testo dell’avviso sul telefono. Dopo l’invio la casella si spegne da sola."
          - label: Importante (in rosso)
            name: importante
            widget: boolean
            default: false
            required: false
            hint: "Acceso: striscia rossa, per pericoli e cambiamenti urgenti. Spento: striscia scura."
          - label: Testo
            name: testo
            widget: string
            required: true
            hint: "Una frase breve, senza link nel testo (es. «La Capanna Adula resta chiusa fino al 20 giugno per lavori»). Con «Pubblica» l’avviso va online."
          - label: Testo in tedesco
            name: testo_de
            widget: string
            required: false
            hint: "Facoltativo: se resta vuoto, sulle pagine in tedesco si vede il testo italiano."
          - label: Testo in inglese
            name: testo_en
            widget: string
            required: false
            hint: "Facoltativo: se resta vuoto, sulle pagine in inglese si vede il testo italiano."
          - label: Link
            name: link
            widget: string
            required: false
            hint: "Facoltativo: una pagina del sito (es. «adula.html» o «news.html») o un indirizzo completo (https://…). Compare come «Scopri di più»."
          - label: Visibile fino al
            name: scadenza
            widget: datetime
            format: "YYYY-MM-DD"
            date_format: "DD.MM.YYYY"
            time_format: false
            required: false
            hint: "Ultimo giorno in cui si vede; il giorno dopo sparisce da solo. Vuoto: resta finché non lo elimini."
          - label: Notifica inviata il
            name: notifica_inviata
            widget: hidden
            required: false
      - label: Capanna Campo Tencia
        name: avviso_campotencia
        file: data/avvisi-capanne/campotencia.json
        fields: &campi_avviso_capanna
          - label: Elimina l’avviso
            name: elimina
            widget: elimina
            required: false
          - label: Invia anche come notifica
            name: notifica
            widget: boolean
            default: false
            required: false
            hint: "Acceso: alla pubblicazione chi ha attivato le notifiche riceve il testo dell’avviso sul telefono, con il nome della capanna; toccandola si apre la pagina della capanna. Dopo l’invio la casella si spegne da sola."
          - label: Importante (in rosso)
            name: importante
            widget: boolean
            default: false
            required: false
            hint: "Acceso: riquadro rosso, per pericoli e cambiamenti urgenti (es. strada chiusa). Spento: riquadro grigio scuro (es. date di apertura)."
          - label: Testo
            name: testo
            widget: text
            required: true
            hint: "Breve, senza link nel testo; si può andare a capo (es. «Aperta dal 13 giugno al 18 ottobre 2027»). Con «Pubblica» l’avviso va online."
          - label: Testo in tedesco
            name: testo_de
            widget: text
            required: false
            hint: "Facoltativo: se resta vuoto, sulla pagina in tedesco si vede il testo italiano."
          - label: Testo in inglese
            name: testo_en
            widget: text
            required: false
            hint: "Facoltativo: se resta vuoto, sulla pagina in inglese si vede il testo italiano."
          - label: Link
            name: link
            widget: string
            required: false
            hint: "Facoltativo: una pagina del sito (es. «news.html») o un indirizzo completo (https://…). Compare come «Scopri di più»."
          - label: Visibile fino al
            name: scadenza
            widget: datetime
            format: "YYYY-MM-DD"
            date_format: "DD.MM.YYYY"
            time_format: false
            required: false
            hint: "Ultimo giorno in cui si vede; il giorno dopo sparisce da solo. Vuoto: resta finché non lo elimini."
          - label: Notifica inviata il
            name: notifica_inviata
            widget: hidden
            required: false
      - label: Capanna Cristallina
        name: avviso_cristallina
        file: data/avvisi-capanne/cristallina.json
        fields: *campi_avviso_capanna
      - label: Capanna Adula
        name: avviso_adula
        file: data/avvisi-capanne/adula.json
        fields: *campi_avviso_capanna
      - label: Capanna Motterascio
        name: avviso_motterascio
        file: data/avvisi-capanne/motterascio.json
        fields: *campi_avviso_capanna
      - label: Capanna Monte Bar
        name: avviso_montebar
        file: data/avvisi-capanne/montebar.json
        fields: *campi_avviso_capanna
      - label: Baita del Luca
        name: avviso_baitadelluca
        file: data/avvisi-capanne/baitadelluca.json
        fields: *campi_avviso_capanna

  - name: mercatino
    label: Mercatino
    label_singular: annuncio
    description: "Annunci di materiale tra privati (arrivano per e-mail a info@casticino.ch). Restano online fino alla scadenza (se vuota: 3 mesi dalla pubblicazione), poi spariscono da soli dalla pagina. Dopo «Pubblica» l’annuncio è online in uno o due minuti."
    folder: data/mercatino
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{date | date('DD.MM.YYYY')}} · {{tipo}} · {{title}}"
    sortable_fields:
      - field: date
        default_sort: desc
      - title
    fields:
      - label: Tipo
        name: tipo
        widget: select
        options: ["Vendo", "Cerco", "Regalo"]
        default: "Vendo"
      - label: Titolo
        name: title
        widget: string
        hint: "Cosa si vende, cerca o regala, breve (es. «Scarponi da sci alpinismo Scarpa, 42»)."
      - label: Pubblicato il
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        default: "{{now}}"
      - label: Scade il
        name: scadenza
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "DD.MM.YYYY"
        time_format: false
        required: false
        hint: "Se resta vuota, l’annuncio resta online 3 mesi dalla pubblicazione. Per rinnovarlo basta spostare la data."
      - label: Concluso (venduto, trovato o regalato)
        name: concluso
        widget: boolean
        default: false
        required: false
        hint: "Acceso: l’annuncio sparisce subito dalla pagina (il file resta qui e si può riattivare)."
      - label: Prezzo
        name: prezzo
        widget: string
        required: false
        hint: "Testo libero, es. «Fr. 120.–» o «da concordare». Vuoto per «Cerco» e «Regalo»."
      - label: Luogo
        name: luogo
        widget: string
        required: false
        hint: "Dove si trova l’oggetto, es. «Bellinzona»."
      - label: Descrizione
        name: testo
        widget: text
        required: false
        hint: "Stato, misure, anno… Gli a capo restano; una riga vuota separa i paragrafi."
      - label: Foto
        name: foto
        widget: list
        required: false
        max: 3
        label_singular: foto
        hint: "Fino a 3 foto, JPG o PNG: vengono ridimensionate e convertite in automatico. La prima è quella grande."
        field:
          label: Foto
          name: src
          widget: image
          choose_url: false
          media_folder: /assets/img/mercatino
          public_folder: assets/img/mercatino
      - label: Nome
        name: nome
        widget: string
        required: false
        hint: "Chi pubblica, come vuole comparire (es. «Laura»)."
      - label: Contatto
        name: contatto
        widget: string
        hint: "E-mail e/o telefono da pubblicare, solo con il consenso di chi ha mandato l’annuncio (es. «laura@esempio.ch, 079 123 45 67»)."

  # Testi di alcune pagine, modificabili senza toccare il codice: data/testi/<pagina>.json, letti da pages.py
  # (testi() e testo_campo()). Per ogni campo l'italiano e, facoltativi, tedesco e inglese.
  - name: testi
    label: "Testi del sito"
    label_singular: "testo"
    description: "Testi di alcune pagine del sito. Cambia quello che serve e premi «Pubblica»: la pagina è aggiornata in uno o due minuti, anche nella ricerca. Se cambi l’italiano, aggiorna anche tedesco e inglese, oppure svuotali: un campo vuoto mostra l’italiano."
    files:
      - label: "Sede e contatti"
        name: sede
        file: data/testi/sede.json
        fields:
          - {label: "Titolo", name: "titolo", widget: "string", hint: "Il titolo grande in cima alla pagina; compare anche nel menu del browser e su Google."}
          - {label: "Titolo in tedesco", name: "titolo_de", widget: "string", required: false}
          - {label: "Titolo in inglese", name: "titolo_en", widget: "string", required: false}
          - {label: "Introduzione", name: "introduzione", widget: "text", hint: "Una o due frasi sotto il titolo."}
          - {label: "Introduzione in tedesco", name: "introduzione_de", widget: "text", required: false}
          - {label: "Introduzione in inglese", name: "introduzione_en", widget: "text", required: false}
          - {label: "Sottotitolo", name: "sottotitolo", widget: "string", hint: "Il titolo del riquadro con i contatti."}
          - {label: "Sottotitolo in tedesco", name: "sottotitolo_de", widget: "string", required: false}
          - {label: "Sottotitolo in inglese", name: "sottotitolo_en", widget: "string", required: false}
          - {label: "Testo", name: "testo", widget: "text", hint: "Il testo accanto ai contatti, sopra il pulsante «Scrivi alla sezione»."}
          - {label: "Testo in tedesco", name: "testo_de", widget: "text", required: false}
          - {label: "Testo in inglese", name: "testo_en", widget: "text", required: false}
          - label: "Contatti"
            name: "righe"
            widget: "list"
            label_singular: "riga"
            summary: "{{fields.etichetta}}"
            hint: "Le righe a destra (recapito, e-mail, sede…), nell’ordine in cui compaiono. Gli a capo restano; gli indirizzi e-mail e https:// diventano link. Le coordinate bancarie si aggiungono da sole in fondo."
            fields:
              - {label: "Etichetta", name: "etichetta", widget: "string", hint: "Es. «Recapito postale»."}
              - {label: "Etichetta in tedesco", name: "etichetta_de", widget: "string", required: false}
              - {label: "Etichetta in inglese", name: "etichetta_en", widget: "string", required: false}
              - {label: "Testo", name: "testo", widget: "text"}
              - {label: "Testo in tedesco", name: "testo_de", widget: "text", required: false}
              - {label: "Testo in inglese", name: "testo_en", widget: "text", required: false}
      - label: "Adesione"
        name: adesione
        file: data/testi/adesione.json
        fields:
          - {label: "Titolo", name: "titolo", widget: "string", hint: "Il titolo grande in cima alla pagina (es. «Diventa socio»)."}
          - {label: "Titolo in tedesco", name: "titolo_de", widget: "string", required: false}
          - {label: "Titolo in inglese", name: "titolo_en", widget: "string", required: false}
          - {label: "Introduzione", name: "introduzione", widget: "text"}
          - {label: "Introduzione in tedesco", name: "introduzione_de", widget: "text", required: false}
          - {label: "Introduzione in inglese", name: "introduzione_en", widget: "text", required: false}
          - label: "Quote annuali"
            name: "quote"
            widget: "list"
            label_singular: "quota"
            summary: "{{fields.nome}}: CHF {{fields.quota}}"
            hint: "Un riquadro per tipo di socio, nell’ordine in cui compaiono."
            fields:
              - {label: "Nome", name: "nome", widget: "string", hint: "Es. «Famiglia»."}
              - {label: "Nome in tedesco", name: "nome_de", widget: "string", required: false}
              - {label: "Nome in inglese", name: "nome_en", widget: "string", required: false}
              - {label: "Per chi", name: "chi", widget: "string", hint: "Es. «Genitori e figli fino a 17 anni»."}
              - {label: "Per chi in tedesco", name: "chi_de", widget: "string", required: false}
              - {label: "Per chi in inglese", name: "chi_en", widget: "string", required: false}
              - {label: "Quota annuale (CHF)", name: "quota", widget: "string", hint: "Solo il numero, es. «179»."}
              - {label: "Tassa d’entrata (CHF)", name: "tassa", widget: "string", hint: "Solo il numero, es. «50»: compare come «+ CHF 50 alla prima iscrizione»."}
          - {label: "Nota sotto le quote", name: "nota", widget: "text"}
          - {label: "Nota in tedesco", name: "nota_de", widget: "text", required: false}
          - {label: "Nota in inglese", name: "nota_en", widget: "text", required: false}
          - label: "Cosa ricevi"
            name: "vantaggi"
            widget: "list"
            label_singular: "vantaggio"
            summary: "{{fields.etichetta}}"
            hint: "Le righe dei vantaggi per i soci. Nel testo un link si scrive [testo](https://indirizzo)."
            fields:
              - {label: "Etichetta", name: "etichetta", widget: "string"}
              - {label: "Etichetta in tedesco", name: "etichetta_de", widget: "string", required: false}
              - {label: "Etichetta in inglese", name: "etichetta_en", widget: "string", required: false}
              - {label: "Testo", name: "testo", widget: "text"}
              - {label: "Testo in tedesco", name: "testo_de", widget: "text", required: false}
              - {label: "Testo in inglese", name: "testo_en", widget: "text", required: false}
      - label: "Soccorso"
        name: soccorso
        file: data/testi/soccorso.json
        fields:
          - {label: "Introduzione", name: "introduzione", widget: "text", hint: "Sotto il titolo «Soccorso». I numeri d’emergenza non si cambiano da qui."}
          - {label: "Introduzione in tedesco", name: "introduzione_de", widget: "text", required: false}
          - {label: "Introduzione in inglese", name: "introduzione_en", widget: "text", required: false}
          - {label: "La colonna di soccorso", name: "colonna", widget: "text", hint: "Una o due frasi accanto al titolo «La colonna di soccorso»."}
          - {label: "La colonna di soccorso in tedesco", name: "colonna_de", widget: "text", required: false}
          - {label: "La colonna di soccorso in inglese", name: "colonna_en", widget: "text", required: false}
          - {label: "La colonna di soccorso: testo", name: "colonna_testo", widget: "markdown", modes: ["rich_text"], buttons: ["bold","italic","link","bulleted-list","numbered-list"], editor_components: [], hint: "Chi la compone, come è organizzata, la formazione, come entrare a farne parte."}
          - {label: "Testo in tedesco", name: "colonna_testo_de", widget: "markdown", modes: ["rich_text"], buttons: ["bold","italic","link","bulleted-list","numbered-list"], editor_components: [], hint: "", required: false}
          - {label: "Testo in inglese", name: "colonna_testo_en", widget: "markdown", modes: ["rich_text"], buttons: ["bold","italic","link","bulleted-list","numbered-list"], editor_components: [], hint: "", required: false}
      - label: "Introduzioni delle pagine"
        name: introduzioni
        file: data/testi/introduzioni.json
        fields:
          - label: "Partecipare alle gite"
            name: "partecipare"
            widget: "object"
            collapsed: true
            summary: "{{fields.introduzione}}"
            fields:
              - {label: "Introduzione", name: "introduzione", widget: "text", hint: "Le frasi sotto il titolo della pagina. Il titolo non si cambia da qui: è anche la voce del menu."}
              - {label: "Introduzione in tedesco", name: "introduzione_de", widget: "text", required: false}
              - {label: "Introduzione in inglese", name: "introduzione_en", widget: "text", required: false}
          - label: "Mettiti in gioco"
            name: "volontariato"
            widget: "object"
            collapsed: true
            summary: "{{fields.introduzione}}"
            fields:
              - {label: "Introduzione", name: "introduzione", widget: "text", hint: "Le frasi sotto il titolo della pagina. Il titolo non si cambia da qui: è anche la voce del menu."}
              - {label: "Introduzione in tedesco", name: "introduzione_de", widget: "text", required: false}
              - {label: "Introduzione in inglese", name: "introduzione_en", widget: "text", required: false}
          - label: "Giovani"
            name: "giovani"
            widget: "object"
            collapsed: true
            summary: "{{fields.introduzione}}"
            fields:
              - {label: "Introduzione", name: "introduzione", widget: "text", hint: "Le frasi sotto il titolo della pagina. Il titolo non si cambia da qui: è anche la voce del menu."}
              - {label: "Introduzione in tedesco", name: "introduzione_de", widget: "text", required: false}
              - {label: "Introduzione in inglese", name: "introduzione_en", widget: "text", required: false}
          - label: "Senior"
            name: "senior"
            widget: "object"
            collapsed: true
            summary: "{{fields.introduzione}}"
            fields:
              - {label: "Introduzione", name: "introduzione", widget: "text", hint: "Le frasi sotto il titolo della pagina. Il titolo non si cambia da qui: è anche la voce del menu."}
              - {label: "Introduzione in tedesco", name: "introduzione_de", widget: "text", required: false}
              - {label: "Introduzione in inglese", name: "introduzione_en", widget: "text", required: false}
          - label: "Corsi"
            name: "corsi"
            widget: "object"
            collapsed: true
            summary: "{{fields.introduzione}}"
