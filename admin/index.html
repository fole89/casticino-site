<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redazione | CAS Ticino</title>
<!-- i percorsi partono dalla radice del sito, come nelle news (assets/…, docs/…): così si vedono anche le foto già pubblicate -->
<base href="../">
<link rel="icon" href="assets/logo-cas.webp">
<link href="admin/config.yml" type="text/yaml" rel="cms-config-url">
<!-- aspetto del sito (caratteri, rosso CAS, angoli vivi): Decap non ha temi, vedi il commento in redazione.css -->
<link rel="stylesheet" href="admin/redazione.css">
</head>
<body>
<!-- Area di redazione delle news e del mercatino: Decap CMS, configurazione in config.yml.
     integrity: il browser esegue lo script solo se è identico a quello verificato; aggiornando la versione va ricalcolata
     (curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A). -->
<script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js" integrity="sha384-A/Gdn928CNLufmnGWGs9RM4Q9o8bSNLeJERqBFrBjwzL7FRpoLT3MPF8Tl0+Wd2p" crossorigin="anonymous"></script>
<script>
// Anteprima della news con lo stile del sito: come apparirà la pagina dell'articolo.
CMS.registerPreviewStyle("assets/site.css");

var MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto",
            "settembre", "ottobre", "novembre", "dicembre"];

function dataIt(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? parseInt(m[3], 10) + " " + MESI[parseInt(m[2], 10) - 1] + " " + m[1] : "";
}

// indirizzo completo di un file (foto caricata in questo momento o già nel sito)
function indirizzo(props, path) {
  if (!path) return null;
  return new URL(String(props.getAsset(path)), document.baseURI).href;
}

var NewsPreview = createClass({
  render: function () {
    var props = this.props, d = props.entry.get("data");
    var foto = indirizzo(props, d.get("image"));
    var testo = d.get("testo"), vecchio = d.get("html");
    var corpo = testo ? props.widgetFor("testo")
      : (vecchio ? h("div", { dangerouslySetInnerHTML: { __html: vecchio.replace(/(src|href)="((assets|docs)\/[^"]*)"/g, function (m, a, p) { return a + '="' + new URL(p, document.baseURI).href + '"'; }) } }) : null);
    var allegati = (d.get("allegati") || []).map ? (d.get("allegati") || []).map(function (a, i) {
      return h("p", { key: i }, h("a", { className: "file-link", href: indirizzo(props, a.get("file")) || "#" }, a.get("titolo") || "Allegato"));
    }) : null;
    return h("main", {},
      h("section", { className: "page-hero article-hero" },
        h("div", { className: "container" },
          h("p", { className: "news-meta" }, h("time", {}, dataIt(d.get("date")))),
          h("h1", { className: "article-title" }, d.get("title") || "Titolo della news"))),
      h("section", { className: "section section--tight" },
        h("div", { className: "container article" + (foto ? "" : " article--noimg") },
          foto ? h("figure", { className: "article-figure" }, h("img", { src: foto, alt: d.get("alt") || "" })) : null,
          h("div", { className: "prose" }, corpo, allegati))));
  }
});
CMS.registerPreviewTemplate("news", NewsPreview);

// Anteprima di un annuncio del mercatino: la scheda come apparirà in mercatino.html.
var AnnuncioPreview = createClass({
  render: function () {
    var props = this.props, d = props.entry.get("data");
    var foto = (d.get("foto") && d.get("foto").toJS ? d.get("foto").toJS() : []).filter(Boolean).slice(0, 3)
      .map(function (f) { return indirizzo(props, f); });
    var tipo = d.get("tipo") || "Vendo";
    var testo = (d.get("testo") || "").split(/\n\s*\n/).filter(function (p) { return p.trim(); });
    var meta = [d.get("luogo"), d.get("date") ? "pubblicato il " + dataIt(d.get("date")) : ""].filter(Boolean).join(" · ");
    var contatto = [d.get("nome"), d.get("contatto")].filter(Boolean).join(": ");
    return h("main", {},
      h("section", { className: "section section--tight" },
        h("div", { className: "container" },
          h("div", { className: "annunci" },
            h("article", { className: "annuncio" },
              foto.length ? h("figure", { className: "annuncio-foto" },
                h("a", {}, h("img", { src: foto[0], alt: "" })),
                foto.length > 1 ? h("div", { className: "annuncio-altre" }, foto.slice(1).map(function (f, i) { return h("a", { key: i }, h("img", { src: f, alt: "" })); })) : null) : null,
              h("div", { className: "annuncio-corpo" },
                h("p", { className: "annuncio-tipo annuncio-tipo--" + tipo.toLowerCase() }, tipo),
                h("h3", { className: "annuncio-titolo" }, d.get("title") || "Titolo dell’annuncio"),
                d.get("prezzo") ? h("p", { className: "annuncio-prezzo" }, d.get("prezzo")) : null,
                testo.length ? h("div", { className: "annuncio-testo" }, testo.map(function (p, i) { return h("p", { key: i, style: { whiteSpace: "pre-line" } }, p); })) : null,
                h("p", { className: "small" }, meta),
                contatto ? h("p", { className: "annuncio-contatto" }, contatto) : null,
                d.get("concluso") ? h("p", { className: "small" }, h("strong", {}, "Concluso: non compare sulla pagina.")) : null))))));
  }
});
CMS.registerPreviewTemplate("mercatino", AnnuncioPreview);

// Avvisi (in cima al sito e delle capanne): si vedono finché hanno un testo. «Elimina» (widget qui sotto) segna l'avviso
// e, alla pubblicazione, preSave svuota i campi: l'avviso sparisce dal sito.
function notaAvviso(d) {
  if (d.get("elimina")) return "Eliminazione dell’avviso in corso…";
  if (!(d.get("testo") || "").trim()) return "Nessun avviso: scrivi il testo e premi «Pubblica».";
  return (d.get("scadenza") ? "Visibile fino al " + dataIt(d.get("scadenza")) + "." : "Visibile finché non lo elimini.") +
    (d.get("notifica") ? " Alla pubblicazione parte anche la notifica." : "");
}

// Il pulsante sta nella barra in alto, accanto a «Pubblica»: Decap non ha un modo per aggiungerne, quindi il widget
// (invisibile nel modulo) lo inserisce lì. «Elimina l'avviso» → «Annulla» / «Conferma»; con «Conferma» il widget segna
// l'avviso, preme «Pubblica» › «Pubblica ora» al posto della redazione e, a pubblicazione fatta, torna all'elenco.
function aspetta(trova, ms) {
  return new Promise(function (ok, ko) {
    var fine = Date.now() + ms;
    (function prova() {
      var el = trova();
      if (el) ok(el); else if (Date.now() > fine) ko(); else setTimeout(prova, 150);
    })();
  });
}
function pulsanteDecap(re) {
  return Array.prototype.find.call(document.querySelectorAll('button, [role="button"], [role="menuitem"], [class*="-PublishButton"], [class*="DropdownItem"]'), function (b) {
    return re.test(b.textContent.trim()) && !b.disabled && !b.closest(".elimina-barra");
  });
}

var EliminaControl = createClass({
  componentDidMount: function () {
    var self = this;
    this.stato = "pronto";
    this.oss = new MutationObserver(function () { self.pulsante(); });
    this.oss.observe(document.body, { childList: true, subtree: true });
    this.pulsante();
  },
  componentDidUpdate: function () { this.pulsante(); },
  componentWillUnmount: function () {
    this.oss.disconnect();
    if (this.barra) this.barra.remove();
  },
  imposta: function (stato) { this.stato = stato; this.disegnato = null; this.pulsante(); },
  elimina: function () {
    var self = this;
    this.imposta("in-corso");
    this.props.onChange(true);
    aspetta(function () { return pulsanteDecap(/^pubblica$/i); }, 5000)
      .then(function (b) { b.click(); return aspetta(function () { return pulsanteDecap(/^pubblica ora$/i); }, 5000); })
      .then(function (b) { b.click(); return aspetta(function () { return document.querySelector('[class*="-PublishedButton"]'); }, 30000); })
      .then(function () { location.hash = "#/collections/avvisi"; })
      .catch(function () {
        self.props.onChange(false);
        self.imposta("pronto");
        alert("L’avviso non è stato eliminato: riprova.");
      });
  },
  pulsante: function () {
    var self = this;
    var testo = (this.props.entry.getIn(["data", "testo"]) || "").trim();
    var stato = !testo && this.stato !== "in-corso" ? "vuoto" : this.stato;
    var dove = document.querySelector('[class*="-ToolbarSubSectionFirst"]');
    if (!dove) return;
    if (!this.barra) { this.barra = document.createElement("div"); this.barra.className = "elimina-barra"; }
    if (this.barra.parentNode !== dove) dove.appendChild(this.barra);
    if (this.disegnato === stato) return;
    this.disegnato = stato;
    this.barra.textContent = "";
    function bottone(testo, cls, azione) {
      var b = document.createElement("button");
      b.type = "button"; b.className = cls; b.textContent = testo;
      if (azione) b.addEventListener("click", azione); else b.disabled = true;
      self.barra.appendChild(b);
    }
    if (stato === "pronto") bottone("Elimina l’avviso", "elimina-btn", function () { self.imposta("chiedi"); });
    else if (stato === "chiedi") {
      var d = document.createElement("span"); d.textContent = "Eliminare l’avviso dal sito?"; this.barra.appendChild(d);
      bottone("Annulla", "elimina-annulla", function () { self.imposta("pronto"); });
      bottone("Conferma", "elimina-conferma", function () { self.elimina(); });
    } else if (stato === "in-corso") bottone("Eliminazione…", "elimina-btn");
  },
  render: function () { return h("span", { className: "elimina" }); }
});
CMS.registerWidget("elimina", EliminaControl, function () { return null; });

CMS.registerEventListener({
  name: "preSave",
  handler: function (args) {
    var data = args.entry.get("data");
    if (!data.has("elimina")) return data;
    if (data.get("elimina")) {
      ["testo", "testo_de", "testo_en", "link", "scadenza"].forEach(function (k) { data = data.set(k, ""); });
      data = data.set("importante", false).set("notifica", false);
    }
    return data.delete("elimina");
  }
});

// Elenco degli avvisi: in rosso quelli ora visibili sul sito (letti dai file pubblicati: dopo «Pubblica» il colore
// cambia in uno o due minuti, quando il sito è aggiornato).
(function () {
  var FILE = { avviso: "data/avviso.json" };
  ["campotencia", "cristallina", "adula", "motterascio", "montebar", "baitadelluca"].forEach(function (c) {
    FILE["avviso_" + c] = "data/avvisi-capanne/" + c + ".json";
  });
  var attivi = {}, letto = 0;
  function oggi() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function leggi() {
    if (Date.now() - letto < 30000) return;
    letto = Date.now();
    Object.keys(FILE).forEach(function (k) {
      fetch(FILE[k], { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (a) {
        var sc = (a.scadenza || "").slice(0, 10);
        attivi[k] = !!(a.testo || "").trim() && (!sc || sc >= oggi());
        segna();
      }).catch(function () {});
    });
  }
  function segna() {
    Array.prototype.forEach.call(document.querySelectorAll('a[href*="/collections/avvisi/entries/"]'), function (a) {
      var k = a.getAttribute("href").split("/entries/")[1];
      var card = a.closest("li") || a;
      card.classList.toggle("avviso-attivo", !!attivi[k]);
    });
  }
  function vai() {
    if (/\/collections\/avvisi\/?$/.test(location.hash)) leggi();
  }
  new MutationObserver(segna).observe(document.body, { childList: true, subtree: true });
  window.addEventListener("hashchange", vai);
  vai();
})();

// Anteprima dell'avviso: la striscia come apparirà in cima alle pagine (italiano, poi tedesco e inglese se scritti).
var AvvisoPreview = createClass({
  render: function () {
    var d = this.props.entry.get("data");
    var cls = "avviso" + (d.get("importante") ? " avviso--importante" : "");
    var righe = [["", d.get("testo")], ["Tedesco: ", d.get("testo_de")], ["Inglese: ", d.get("testo_en")]].filter(function (r) { return r[1]; });
    var nota = notaAvviso(d);
    return h("main", {},
      righe.length && !d.get("elimina") ? righe.map(function (r, i) {
        return h("aside", { key: i, className: cls, style: { marginBottom: "12px" } },
          h("div", { className: "container avviso-inner" },
            h("p", {}, h("span", {}, r[0] + r[1]), d.get("link") ? h("span", {}, " ", h("a", {}, "Scopri di più")) : null)));
      }) : d.get("elimina") ? null : h("p", { className: "small", style: { padding: "24px" } }, "Scrivi il testo dell’avviso: qui compare la striscia come sul sito."),
      h("p", { className: "small", style: { padding: "0 24px" } }, nota));
  }
});
CMS.registerPreviewTemplate("avviso", AvvisoPreview);

// Anteprima dell'avviso di una capanna: il riquadro come apparirà sotto la foto (italiano, poi tedesco e inglese se scritti).
var AvvisoCapannaPreview = createClass({
  render: function () {
    var d = this.props.entry.get("data");
    var imp = d.get("importante");
    var righe = [["Avviso", "Importante", d.get("testo")], ["Hinweis", "Wichtig", d.get("testo_de")], ["Notice", "Important", d.get("testo_en")]]
      .filter(function (r) { return r[2]; });
    var nota = notaAvviso(d);
    return h("main", {},
      h("section", { className: "section section--tight" },
        h("div", { className: "container" },
          righe.length && !d.get("elimina") ? righe.map(function (r, i) {
            return h("div", { key: i, className: "avviso-capanna" + (imp ? " avviso-capanna--importante" : ""), style: { marginBottom: "12px" } },
              h("p", { className: "avviso-capanna-tipo" }, imp ? r[1] : r[0]),
              h("p", {}, h("span", {}, r[2]), d.get("link") ? h("span", {}, " ", h("a", {}, ["Scopri di più", "Mehr erfahren", "Find out more"][i])) : null));
          }) : d.get("elimina") ? null : h("p", { className: "small" }, "Scrivi il testo dell’avviso: qui compare il riquadro come sulla pagina della capanna."),
          h("p", { className: "small" }, nota))));
  }
});
["campotencia", "cristallina", "adula", "motterascio", "montebar", "baitadelluca"].forEach(function (c) {
  CMS.registerPreviewTemplate("avviso_" + c, AvvisoCapannaPreview);
});

// Anteprima di Sede e contatti: la parte alta della pagina come apparirà (in italiano).
var aCapo = { whiteSpace: "pre-line" };
var SedePreview = createClass({
  render: function () {
    var d = this.props.entry.get("data");
    var righe = (d.get("righe") || []).map ? d.get("righe") : [];
    return h("main", {},
      h("section", { className: "page-hero" },
        h("div", { className: "container" },
          h("h1", { className: "display" }, d.get("titolo")),
          h("p", { className: "lead", style: aCapo }, d.get("introduzione")))),
      h("section", { className: "section" },
        h("div", { className: "container" },
          h("div", { className: "contact" },
            h("div", { className: "contact-intro" },
              h("h2", { className: "h2" }, d.get("sottotitolo")),
              h("p", { style: aCapo }, d.get("testo")),
              h("div", {}, h("a", { className: "btn btn--primary" }, "Scrivi alla sezione →"))),
            h("dl", { className: "facts" }, righe.map(function (r, i) {
              return [h("dt", { key: "t" + i }, r.get("etichetta")), h("dd", { key: "d" + i, style: aCapo }, r.get("testo"))];
            }), h("dt", {}, "Coordinate bancarie"), h("dd", {}, "Banca Stato, Lugano (aggiunte in automatico)"))))));
  }
});
CMS.registerPreviewTemplate("sede", SedePreview);
</script>
</body>
</html>
